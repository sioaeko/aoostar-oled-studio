name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config shellcheck

      - name: Build and test OLED Studio
        working-directory: oled-studio/source
        run: |
          bun install --frozen-lockfile
          bun audit
          bun test
          bun run build

      - name: Verify committed web bundle
        run: |
          git diff --exit-code -- oled-studio/dist
          test -z "$(git ls-files --others --exclude-standard -- oled-studio/dist)"

      - name: Check Linux tooling
        run: |
          bash -n linux/install-asterctl-web.sh
          bash -n linux/verify-asterctl-web-package.sh
          bash -n linux/tests/test-installer-device-policy.sh
          shellcheck -x linux/install-asterctl-web.sh linux/verify-asterctl-web-package.sh linux/tests/test-installer-device-policy.sh
          bash linux/tests/test-installer-device-policy.sh
          python3 -m py_compile linux/brightness-probe.py
          python3 linux/tests/test-brightness-probe-device-policy.py

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked
