[package]
name = "asterctl-web"
version = "0.2.5"
description = "Embedded web UI and HTTP bridge for AOOSTAR displays"
readme = "README.md"
keywords = ["aoostar", "oled", "rgb565", "web"]
categories = ["hardware-support", "web-programming::http-server"]
publish = false

rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
asterctl-lcd = { path = "../asterctl-lcd", version = "0.2.0" }
axum = { version = "0.8.4", features = ["multipart"] }
clap = { version = "4.5.42", features = ["derive"] }
env_logger = "0.11.8"
image.workspace = true
log.workspace = true
mime_guess = "2.0.5"
rust-embed = "8.7.2"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["cors"] }
url = "2.5.4"

[dev-dependencies]
http-body-util = "0.1.3"
http = "1.3.1"
serde_json = "1.0.142"
tower = { version = "0.5.2", features = ["util"] }
